apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - order-service.yaml
configMapGenerator:
  - name: order-service-config
    envs:
      - app.env
generatorOptions:
  immutable: true
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: orderflow
      app.kubernetes.io/managed-by: kustomize
