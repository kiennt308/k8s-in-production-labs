{{- if .Values.cache.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: orderflow-cache-headless
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: orderflow-cache
    app.kubernetes.io/component: cache
    {{ include "orderflow.commonLabels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: orderflow-cache
    app.kubernetes.io/part-of: orderflow
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: v1
kind: Service
metadata:
  name: orderflow-cache
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: orderflow-cache
    app.kubernetes.io/component: cache
    {{ include "orderflow.commonLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orderflow-cache
    app.kubernetes.io/part-of: orderflow
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
