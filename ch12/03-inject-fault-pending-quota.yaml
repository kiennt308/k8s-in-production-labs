# Chapter 12 Lab - Fault 3: Pending Pod + ReplicaSet Quota Rejection
# Combines oversized resource requests with a non-matching nodeSelector.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-worker
  namespace: orderflow-staging
  labels:
    app.kubernetes.io/name: payment-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: orderflow
    spec:
      serviceAccountName: payment-worker-sa
      automountServiceAccountToken: false
      nodeSelector:
        hardware-profile: fpga-v2
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          command:
            - ./podinfo
          args:
            - --port=9898
            - --level=info
          ports:
            - name: http
              containerPort: 9898
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 1500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
