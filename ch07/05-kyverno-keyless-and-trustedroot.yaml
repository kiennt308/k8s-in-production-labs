# Kyverno v1.20 keyless Cosign v3.1.4 verification using OIDC + Rekor
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: orderflow-verify-cosign-keyless
  labels:
    app.kubernetes.io/part-of: orderflow
spec:
  validationActions:
    - Deny
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: orderflow-prod
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "ghcr.io/stefanprodan/podinfo:*"
    - glob: "ghcr.io/stefanprodan/podinfo@*"
  validationConfigurations:
    mutateDigest: true
    verifyDigest: true
    required: true
  attestors:
    - name: cosignKeyless
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subjectRegExp: '^https://github\.com/stefanprodan/.*$'
          rekor:
            url: "https://rekor.sigstore.dev"
  validations:
    - message: >-
        Image failed Sigstore Cosign keyless OIDC verification.
      expression: >-
        images.containers.map(img,
          verifyImageSignatures(img, [attestors.cosignKeyless])
        ).all(cnt, cnt > 0)
