apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-gateway-sa
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: order-gateway
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: orderflow
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service-sa
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: orderflow
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-worker-sa
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: payment-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: orderflow
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orderflow-db-sa
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: orderflow-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: orderflow
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orderflow-cache-sa
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: orderflow-cache
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: orderflow
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orderflow-config-watcher-sa
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: orderflow-config-watcher
    app.kubernetes.io/part-of: orderflow
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: orderflow-gateway-config-reader
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/part-of: orderflow
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["order-gateway-nginx"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orderflow-config-watcher-binding
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/part-of: orderflow
subjects:
  - kind: ServiceAccount
    name: orderflow-config-watcher-sa
    namespace: orderflow-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orderflow-gateway-config-reader
