apiVersion: v1
kind: ConfigMap
metadata:
  name: orderflow-policy-params
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/part-of: orderflow
data:
  allowedPrefixes: "nginxinc/,ghcr.io/stefanprodan/,postgres:,redis:"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: orderflow-prod-guard-binding
  labels:
    app.kubernetes.io/part-of: orderflow
spec:
  policyName: orderflow-image-and-label-guard
  validationActions:
    - Deny
  paramRef:
    name: orderflow-policy-params
    namespace: orderflow-prod
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: orderflow-prod
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: orderflow-staging-guard-binding
  labels:
    app.kubernetes.io/part-of: orderflow
spec:
  policyName: orderflow-image-and-label-guard
  validationActions:
    - Warn
    - Audit
  paramRef:
    name: orderflow-policy-params
    namespace: orderflow-prod
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: orderflow-staging
