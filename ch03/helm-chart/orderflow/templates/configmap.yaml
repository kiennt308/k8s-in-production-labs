apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config-{{ include "orderflow.configHash" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: api
    {{ include "orderflow.commonLabels" . | nindent 4 }}
immutable: true
data:{{- include "orderflow.configData" . | nindent 2 }}
