apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orderflow-http-redirect
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: orderflow-public-gw
      namespace: platform-gateway
      sectionName: http
  hostnames:
    - orderflow.example.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orderflow-routes
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: orderflow-public-gw
      namespace: platform-gateway
      sectionName: https
  hostnames:
    - orderflow.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/orders
      timeouts:
        request: 10s
        backendRequest: 5s
      backendRefs:
        - group: ""
          kind: Service
          name: order-service
          port: 9898
          weight: 100
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: order-gateway
          port: 8080
          weight: 100
