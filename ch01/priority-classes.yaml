apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: orderflow-critical
  labels:
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
value: 1000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: >-
  Priority tier for revenue-critical OrderFlow edge and API pods.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: orderflow-standard
  labels:
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
value: 100000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: >-
  Priority tier for asynchronous OrderFlow workers and staging pods.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: orderflow-batch
  labels:
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
value: 10000
globalDefault: false
preemptionPolicy: Never
description: >-
  Non-preempting priority tier for batch and backoffice jobs.
