apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-orderflow-db-ingress
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: orderflow-db
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: orderflow-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - order-service
                  - payment-worker
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-orderflow-cache-ingress
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: orderflow-cache
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: orderflow-cache
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - order-service
                  - payment-worker
      ports:
        - protocol: TCP
          port: 6379
