apiVersion: v1
kind: Pod
metadata:
  name: insecure-root-debug
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: insecure-root-debug
    app.kubernetes.io/part-of: orderflow
spec:
  containers:
    - name: debug
      image: nginxinc/nginx-unprivileged:1.27-alpine
      securityContext:
        runAsUser: 0
        allowPrivilegeEscalation: true
