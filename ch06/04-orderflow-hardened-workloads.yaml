apiVersion: v1
kind: Service
metadata:
  name: orderflow-db
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: orderflow-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: orderflow-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orderflow-db
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: orderflow-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
spec:
  serviceName: orderflow-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orderflow-db
      app.kubernetes.io/part-of: orderflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orderflow-db
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: orderflow
        app.kubernetes.io/managed-by: kubectl
    spec:
      serviceAccountName: orderflow-db-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: orders
            - name: POSTGRES_USER
              value: orderflow
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orderflow-db-secret
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - orderflow
                - -d
                - orders
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: run-pg
              mountPath: /var/run/postgresql
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        - name: run-pg
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: orderflow-cache
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: orderflow-cache
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
spec:
  selector:
    app.kubernetes.io/name: orderflow-cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orderflow-cache
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: orderflow-cache
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
spec:
  serviceName: orderflow-cache
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orderflow-cache
      app.kubernetes.io/part-of: orderflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orderflow-cache
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: orderflow
        app.kubernetes.io/managed-by: kubectl
    spec:
      serviceAccountName: orderflow-cache-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --dir
            - /data
            - --appendonly
            - "yes"
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
