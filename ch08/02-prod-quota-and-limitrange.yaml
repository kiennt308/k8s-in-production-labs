apiVersion: v1
kind: ResourceQuota
metadata:
  name: orderflow-prod-quota
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/part-of: orderflow
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.memory: 8Gi
    pods: "25"
    persistentvolumeclaims: "6"
    requests.storage: 20Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: orderflow-prod-limits
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/part-of: orderflow
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        memory: 256Mi
      min:
        cpu: 25m
        memory: 32Mi
      max:
        cpu: "2"
        memory: 2Gi
    - type: PersistentVolumeClaim
      min:
        storage: 1Gi
      max:
        storage: 10Gi
