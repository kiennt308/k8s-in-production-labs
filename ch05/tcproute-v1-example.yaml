apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: order-grpc-raw-tcp
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: orderflow-public-gw
      namespace: platform-gateway
      sectionName: grpc-tcp
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: order-service
          port: 9999
