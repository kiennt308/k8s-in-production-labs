apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-canary
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: order-service-canary
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service-canary
      app.kubernetes.io/part-of: orderflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service-canary
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: orderflow
    spec:
      serviceAccountName: order-service-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: order-service
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          imagePullPolicy: IfNotPresent
          args:
            - ./podinfo
            - --port=9898
            - --ui-message=canary-v2
          ports:
            - name: http
              containerPort: 9898
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: data
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service-canary
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: order-service-canary
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: order-service-canary
    app.kubernetes.io/part-of: orderflow
  ports:
    - name: http
      port: 9898
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orderflow-routes
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: orderflow-public-gw
      namespace: platform-gateway
      sectionName: https
  hostnames:
    - orderflow.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/orders
          headers:
            - type: Exact
              name: X-Canary
              value: always
      timeouts:
        request: 10s
        backendRequest: 5s
      backendRefs:
        - group: ""
          kind: Service
          name: order-service-canary
          port: 9898
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/orders
      timeouts:
        request: 10s
        backendRequest: 5s
      backendRefs:
        - group: ""
          kind: Service
          name: order-service
          port: 9898
          weight: 90
        - group: ""
          kind: Service
          name: order-service-canary
          port: 9898
          weight: 10
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: order-gateway
          port: 8080
