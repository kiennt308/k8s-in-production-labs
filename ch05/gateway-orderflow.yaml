apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: orderflow-public-gw
  namespace: platform-gateway
  labels:
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: orderflow.example.com
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: orderflow-prod
    - name: https
      protocol: HTTPS
      port: 443
      hostname: orderflow.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: orderflow-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: orderflow-prod
