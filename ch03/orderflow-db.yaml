apiVersion: v1
kind: ServiceAccount
metadata:
  name: orderflow-db-sa
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: orderflow-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: orderflow-db-secret
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: orderflow-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  # Lab demo value only; sync via External Secrets in production.
  password: "orderflow-lab-change-me-2026"
---
apiVersion: v1
kind: Service
metadata:
  name: orderflow-db
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: orderflow-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    app.kubernetes.io/name: orderflow-db
    app.kubernetes.io/part-of: orderflow
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orderflow-db
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: orderflow-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
spec:
  serviceName: orderflow-db
  replicas: 1
  podManagementPolicy: OrderedReady
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: orderflow-db
      app.kubernetes.io/part-of: orderflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orderflow-db
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: orderflow
        app.kubernetes.io/managed-by: kubectl
    spec:
      serviceAccountName: orderflow-db-sa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: POSTGRES_DB
              value: orders
            - name: POSTGRES_USER
              value: orderflow
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orderflow-db-secret
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: pg-run
              mountPath: /var/run/postgresql
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - orderflow
                - -d
                - orders
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - orderflow
                - -d
                - orders
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: pg-run
          emptyDir:
            sizeLimit: 16Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: orderflow-db
          app.kubernetes.io/part-of: orderflow
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: orderflow-fast-retain
        resources:
          requests:
            storage: 10Gi
