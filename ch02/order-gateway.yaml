apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-gateway-sa
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: order-gateway
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-gateway-nginx
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: order-gateway
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
data:
  default.conf: |
    upstream order_backend {
      server order-service.orderflow-prod.svc.cluster.local:9898;
    }

    server {
      listen 8080;
      server_name _;

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      location = / {
        default_type application/json;
        return 200 '{"service":"order-gateway","status":"ok"}\n';
      }

      location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_pass http://order_backend/;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: order-gateway
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: order-gateway
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: order-gateway
    app.kubernetes.io/part-of: orderflow
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-gateway
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: order-gateway
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: order-gateway
      app.kubernetes.io/part-of: orderflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-gateway
        app.kubernetes.io/component: edge
        app.kubernetes.io/part-of: orderflow
        app.kubernetes.io/managed-by: kubectl
    spec:
      serviceAccountName: order-gateway-sa
      automountServiceAccountToken: false
      priorityClassName: orderflow-critical
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: order-gateway
              app.kubernetes.io/part-of: orderflow
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: order-gateway
              app.kubernetes.io/part-of: orderflow
      containers:
        - name: order-gateway
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    sleep 10
                    nginx -s quit
                    while [ -f /tmp/nginx.pid ] && \
                      kill -0 "$(cat /tmp/nginx.pid)" 2>/dev/null; do
                      sleep 1
                    done
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: nginx-conf
          configMap:
            name: order-gateway-nginx
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
