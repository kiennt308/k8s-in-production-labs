apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service-sa
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: orderflow
  ports:
    - name: http
      port: 9898
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 9999
      targetPort: grpc
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
      app.kubernetes.io/part-of: orderflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: orderflow
        app.kubernetes.io/managed-by: kubectl
    spec:
      serviceAccountName: order-service-sa
      automountServiceAccountToken: false
      priorityClassName: orderflow-critical
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: order-service
              app.kubernetes.io/part-of: orderflow
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: order-service
              app.kubernetes.io/part-of: orderflow
      initContainers:
        - name: log-relay
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              ts() { date -u +%Y-%m-%dT%H:%M:%SZ; }
              stop=0
              trap 'stop=1' TERM INT
              echo "$(ts) log-relay initializing"
              sleep 2 &
              wait $! || true
              if [ "$stop" -eq 0 ]; then
                : > /tmp/sidecar.ready
                echo "$(ts) log-relay ready"
              fi
              while [ "$stop" -eq 0 ]; do
                sleep 5 &
                wait $! || true
              done
              echo "$(ts) log-relay flushing /data"
              sleep 1
              rm -f /tmp/sidecar.ready
              echo "$(ts) log-relay exited"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          startupProbe:
            exec:
              command: ["test", "-f", "/tmp/sidecar.ready"]
            periodSeconds: 1
            failureThreshold: 10
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/sidecar.ready"]
            periodSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - name: tmp-sidecar
              mountPath: /tmp
            - name: data
              mountPath: /data
      containers:
        - name: order-service
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          imagePullPolicy: IfNotPresent
          command:
            - ./podinfo
            - --port=9898
            - --grpc-port=9999
            - --level=info
          ports:
            - name: http
              containerPort: 9898
              protocol: TCP
            - name: grpc
              containerPort: 9999
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 15
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: tmp-sidecar
          emptyDir: {}
        - name: data
          emptyDir: {}
