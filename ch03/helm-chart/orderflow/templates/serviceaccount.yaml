apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service-sa
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: api
    {{ include "orderflow.commonLabels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.database.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orderflow-db-sa
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: orderflow-db
    app.kubernetes.io/component: database
    {{ include "orderflow.commonLabels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.cache.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orderflow-cache-sa
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: orderflow-cache
    app.kubernetes.io/component: cache
    {{ include "orderflow.commonLabels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
