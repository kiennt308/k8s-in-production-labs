apiVersion: v1
kind: ResourceQuota
metadata:
  name: orderflow-staging-quota
  namespace: orderflow-staging
  labels:
    app.kubernetes.io/part-of: orderflow
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "12"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: orderflow-staging-batch-cap
  namespace: orderflow-staging
  labels:
    app.kubernetes.io/part-of: orderflow
spec:
  hard:
    requests.cpu: 500m
    requests.memory: 512Mi
    limits.memory: 1Gi
    pods: "4"
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: In
        values:
          - orderflow-batch
---
apiVersion: v1
kind: LimitRange
metadata:
  name: orderflow-staging-limits
  namespace: orderflow-staging
  labels:
    app.kubernetes.io/part-of: orderflow
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 256Mi
      min:
        cpu: 20m
        memory: 32Mi
      max:
        cpu: "1"
        memory: 1Gi
      maxLimitRequestRatio:
        memory: 4
