{{- if .Values.cache.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orderflow-cache
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: orderflow-cache
    app.kubernetes.io/component: cache
    {{ include "orderflow.commonLabels" . | nindent 4 }}
spec:
  serviceName: orderflow-cache-headless
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: orderflow-cache
      app.kubernetes.io/part-of: orderflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orderflow-cache
        app.kubernetes.io/component: cache
        {{ include "orderflow.commonLabels" . | nindent 8 }}
    spec:
      serviceAccountName: orderflow-cache-sa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          {{- $img := .Values.cache.image }}
          image: {{ printf "%s:%s" $img.repository $img.tag }}
          imagePullPolicy: {{ $img.pullPolicy }}
          args:
            - redis-server
            - --dir
            - /data
            - --appendonly
            - "yes"
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.cache.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: orderflow-cache
          app.kubernetes.io/part-of: orderflow
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.global.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.cache.storageSize }}
{{- end }}
