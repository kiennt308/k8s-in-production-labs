apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: order-service-l7-guard
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: order-service
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: order-gateway
      toPorts:
        - ports:
            - port: "9898"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: "^/(healthz|readyz)$"
              - method: GET
                path: "^/api/v1/orders.*$"
              - method: POST
                path: "^/api/v1/orders$"
