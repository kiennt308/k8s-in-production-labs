apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: api
    {{ include "orderflow.commonLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: orderflow
  ports:
    - name: http
      port: 9898
      targetPort: http
    - name: grpc
      port: 9999
      targetPort: grpc
