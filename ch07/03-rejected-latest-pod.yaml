apiVersion: v1
kind: Pod
metadata:
  name: unverified-latest-test
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: unverified-latest-test
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: rogue
      image: docker.io/library/nginx:latest
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop:
            - ALL
