apiVersion: v1
kind: ConfigMap
metadata:
  name: order-gateway-nginx
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: order-gateway
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }

      location /api/ {
        proxy_pass http://order-service.orderflow-prod.svc:9898/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }

      location / {
        proxy_pass http://order-service.orderflow-prod.svc:9898/;
        proxy_set_header Host $host;
      }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: orderflow-db-secret
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: orderflow-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  # Lab placeholder only; source from KMS/ESO in real environments.
  password: "orderflow-lab-change-me"
---
apiVersion: v1
kind: Service
metadata:
  name: order-gateway
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: order-gateway
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
spec:
  selector:
    app.kubernetes.io/name: order-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-gateway
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: order-gateway
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: order-gateway
      app.kubernetes.io/part-of: orderflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-gateway
        app.kubernetes.io/component: edge
        app.kubernetes.io/part-of: orderflow
        app.kubernetes.io/managed-by: kubectl
    spec:
      serviceAccountName: order-gateway-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: nginx-conf
          configMap:
            name: order-gateway-nginx
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        - name: cache
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: orderflow-prod
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: orderflow
    app.kubernetes.io/managed-by: kubectl
spec:
  selector:
    app.kubernetes.io/name: order-service
  ports:
    - name: http
      port: 9898
      targetPort: http
    - name: grpc
      port: 9999
      targetPort: grpc
---
